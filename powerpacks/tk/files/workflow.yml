# THIS FILE IS GENERATED AND KEPT UP TO DATE BY `tk update`; DO NOT EDIT;
name: tk
on:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: check that the powerpacks are up to date
        run: go tool tk status --check

  update:
    if: github.event_name != 'pull_request'
    name: update
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: update the powerpacks
        run: go tool tk update
      - name: open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
          BRANCH: 'tk/update'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "powerpacks are already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A
          git commit -m "chore: update tk powerpacks"
          git push --force -u origin "$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base "$BASE" --head "$BRANCH" \
              --title "chore: update tk powerpacks" \
              --body "Regenerated by \`tk update\` from the tk pinned in go.mod."
          fi
