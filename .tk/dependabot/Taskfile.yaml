version: '3'

vars:
  DEFAULT_DEPENDABOT_CONFIG_FILENAME: 'dependabot.yml'
  DEFAULT_DEPENDABOT_INTERVAL: 'weekly'
  DEFAULT_DEPENDABOT_COMMIT_PREFIX: 'chore'

tasks:
  default:
    cmds:
      - task: config

  pre-commit:
    cmds:
      - task: config

  config:
    desc: Generate the Dependabot configuration
    summary: |
      Generate a standardized `.github/dependabot.yml`.

      Updates are grouped per ecosystem so a repository gets one pull request per week instead of one per
      dependency, which matters for a Go module with a large indirect dependency list.

      The following variables are available:

      | VARIABLE          | DESCRIPTION                        | DEFAULT |
      |-------------------|------------------------------------|---------|
      | `CONFIG_FILENAME` | configuration filename in .github  | `{{ .DEFAULT_DEPENDABOT_CONFIG_FILENAME }}` |
      | `INTERVAL`        | how often Dependabot looks for updates | `{{ .DEFAULT_DEPENDABOT_INTERVAL }}` |
      | `COMMIT_PREFIX`   | conventional commit prefix         | `{{ .DEFAULT_DEPENDABOT_COMMIT_PREFIX }}` |

      The file is generated once and never overwritten, so it can be edited afterwards: uncomment the docker
      ecosystem, add a directory for a monorepo, or ignore a dependency.

      Examples:
        - `task {{ .TASK }}` writes `.github/dependabot.yml`
        - `INTERVAL=daily task {{ .TASK }}` checks for updates every day
    vars:
      CONFIG_FILENAME: '{{ .ROOT_DIR }}/.github/{{ .CONFIG_FILENAME | default .DEFAULT_DEPENDABOT_CONFIG_FILENAME }}'
      INTERVAL: '{{ .INTERVAL | default .DEFAULT_DEPENDABOT_INTERVAL }}'
      COMMIT_PREFIX: '{{ .COMMIT_PREFIX | default .DEFAULT_DEPENDABOT_COMMIT_PREFIX }}'
    cmds:
      - mkdir -p $(dirname "{{ .CONFIG_FILENAME }}")
      - echo "${CONFIG_CONTENT}" > "{{ .CONFIG_FILENAME }}"
    status:
      - test -f '{{ .CONFIG_FILENAME }}'
    env:
      CONFIG_CONTENT: |
        # THIS FILE HAS BEEN GENERATED BY THE COMMAND `{{ .TASK }}`;
        # It is generated once and never overwritten: edit it freely.
        version: 2
        updates:
          # Go modules, including the tools pinned in the `tool` block of go.mod (golangci-lint, tk, ...).
          - package-ecosystem: gomod
            directory: /
            schedule:
              interval: {{ .INTERVAL }}
            groups:
              gomod:
                patterns:
                  - "*"
            commit-message:
              prefix: {{ .COMMIT_PREFIX }}
              include: scope

          # Actions used by the workflows in .github/workflows.
          - package-ecosystem: github-actions
            directory: /
            schedule:
              interval: {{ .INTERVAL }}
            groups:
              github-actions:
                patterns:
                  - "*"
            commit-message:
              prefix: {{ .COMMIT_PREFIX }}
              include: scope

          # Uncomment when the repository ships a Dockerfile.
          # - package-ecosystem: docker
          #   directory: /
          #   schedule:
          #     interval: {{ .INTERVAL }}
          #   commit-message:
          #     prefix: {{ .COMMIT_PREFIX }}
          #     include: scope
