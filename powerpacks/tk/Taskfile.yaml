version: '3'

vars:
  DEFAULT_GO_BIN: 'go'
  DEFAULT_TK_PACKAGE: 'github.com/merlindorin/tk/cmd/tk'
  DEFAULT_TK_BIN_NAME: 'tk'
  DEFAULT_TK_VERSION: 'latest'
  DEFAULT_TK_GITHUBACTION_FILENAME: 'tk.yml'
  DEFAULT_TK_SCHEDULE: '0 6 * * 1'
  DEFAULT_TK_BRANCH: 'tk/update'

tasks:
  default:
    cmds:
      - task: ci

  pre-commit:
    cmds:
      - task: status

  install:
    desc: Pin tk as a tool of this module
    summary: |
      Pin tk in the `tool` block of go.mod.

      Pinning it there rather than installing it globally is what lets Dependabot keep tk itself up to date: the
      `gomod` ecosystem covers tool directives, so a new tk release becomes a pull request like any other bump.

      The following variables are available:

      | VARIABLE  | DESCRIPTION       | DEFAULT |
      |-----------|-------------------|---------|
      | `GO_BIN`  | go binary         | `{{ .DEFAULT_GO_BIN }}` |
      | `PACKAGE` | tk package        | `{{ .DEFAULT_TK_PACKAGE }}` |
      | `VERSION` | version to pin    | `{{ .DEFAULT_TK_VERSION }}` |
    vars:
      GO_BIN: '{{ .GO_BIN | default .DEFAULT_GO_BIN }}'
      PACKAGE: '{{ .PACKAGE | default .DEFAULT_TK_PACKAGE }}'
      VERSION: '{{ .VERSION | default .DEFAULT_TK_VERSION }}'
    cmd: '{{ .GO_BIN }} get -tool {{ .PACKAGE }}@{{ .VERSION }}'
    status:
      - go tool | grep {{ .PACKAGE }}

  uninstall:
    vars:
      GO_BIN: '{{ .GO_BIN | default .DEFAULT_GO_BIN }}'
      PACKAGE: '{{ .PACKAGE | default .DEFAULT_TK_PACKAGE }}'
    cmd: '{{ .GO_BIN }} get -tool {{ .PACKAGE }}@none'

  run:
    desc: Run the pinned tk
    summary: |
      Run tk. The purpose is to have a reusable way to run the tk pinned in go.mod.

      The following variables are available:

      | VARIABLE   | DESCRIPTION   | DEFAULT |
      |------------|---------------|---------|
      | `BIN_NAME` | tk bin name   | `{{ .DEFAULT_TK_BIN_NAME }}` |
      | `TK_ARGS`  | tk arguments  | `` |

      Examples:
        - `task {{ .TASK }} -- list` is similar to `tk list`
        - `TK_ARGS="status" task {{ .TASK }}` is similar to `tk status`
    vars:
      BIN_NAME: '{{ .BIN_NAME | default .DEFAULT_TK_BIN_NAME }}'
      GO_BIN: '{{ .GO_BIN | default .DEFAULT_GO_BIN }}'
    cmd: '{{ .GO_BIN }} tool {{ .BIN_NAME }} {{ .TK_ARGS }} {{ .CLI_ARGS }}'

  update:
    desc: Regenerate the powerpacks from the pinned tk
    summary: |
      Regenerate `.tk/` and the tk owned lines of `Taskfile.yaml` and `.envrc` from the powerpacks embedded in the
      pinned tk. Run it after Dependabot bumps tk in go.mod.
    cmds:
      - task: run
        vars:
          TK_ARGS: 'update'

  status:
    desc: Fail when the powerpacks are out of date
    summary: |
      Report what `update` would change and exit with a non-zero status when the project is out of date. This is
      what the generated GitHub Action runs on pull requests.
    cmds:
      - task: run
        vars:
          TK_ARGS: 'status --check'

  ci:
    desc: Generate GitHub Action
    summary: |
      Generate a standardized GitHub Action keeping the powerpacks in sync:
        - on a pull request it fails when `.tk/` is out of date with the pinned tk
        - on a schedule (and on demand) it regenerates them and opens a pull request

      The following variables are available:

      | VARIABLE   | DESCRIPTION                          | DEFAULT |
      |------------|--------------------------------------|---------|
      | `SCHEDULE` | cron expression of the update job    | `{{ .DEFAULT_TK_SCHEDULE }}` |
      | `BRANCH`   | branch holding the generated updates | `{{ .DEFAULT_TK_BRANCH }}` |

      This configuration is auto-generated and should not be manually modified as it can be overwritten.
    vars:
      GITHUBACTION_FILENAME: '{{ .ROOT_DIR }}/.github/workflows/{{ .GITHUBACTION_FILENAME | default .DEFAULT_TK_GITHUBACTION_FILENAME }}'
      SCHEDULE: '{{ .SCHEDULE | default .DEFAULT_TK_SCHEDULE }}'
      BRANCH: '{{ .BRANCH | default .DEFAULT_TK_BRANCH }}'
    cmds:
      - mkdir -p $(dirname "{{ .GITHUBACTION_FILENAME }}")
      - echo "${GITHUBACTION_CONTENT}" > "{{ .GITHUBACTION_FILENAME }}"
    status:
      - test -f '{{ .GITHUBACTION_FILENAME }}'
    env:
      GITHUBACTION_CONTENT: |
        # THIS FILE HAS BEEN GENERATED BY THE COMMAND `{{ .TASK }}`; DO NOT EDIT;
        name: tk
        on:
          pull_request:
          schedule:
            - cron: '{{ .SCHEDULE }}'
          workflow_dispatch:

        permissions:
          contents: read

        jobs:
          check:
            if: github.event_name == 'pull_request'
            name: check
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@v4
              - uses: actions/setup-go@v5
                with:
                  go-version-file: go.mod
              - name: check that the powerpacks are up to date
                run: go tool tk status --check

          update:
            if: github.event_name != 'pull_request'
            name: update
            runs-on: ubuntu-latest
            permissions:
              contents: write
              pull-requests: write
            steps:
              - uses: actions/checkout@v4
              - uses: actions/setup-go@v5
                with:
                  go-version-file: go.mod
              - name: update the powerpacks
                run: go tool tk update
              - name: open a pull request
                env:
                  GH_TOKEN: ${{ "{{ github.token }}" }}
                  BASE: ${{ "{{ github.ref_name }}" }}
                  BRANCH: '{{ .BRANCH }}'
                run: |
                  if [ -z "$(git status --porcelain)" ]; then
                    echo "powerpacks are already up to date"
                    exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git switch -c "$BRANCH"
                  git add -A
                  git commit -m "chore: update tk powerpacks"
                  git push --force -u origin "$BRANCH"

                  if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
                    gh pr create --base "$BASE" --head "$BRANCH" \
                      --title "chore: update tk powerpacks" \
                      --body "Regenerated by \`tk update\` from the tk pinned in go.mod."
                  fi
