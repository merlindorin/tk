# THIS FILE HAS BEEN GENERATED BY THE COMMAND `goreleaser:ci`; DO NOT EDIT;
#
# Releaser workflow setup
# https://goreleaser.com/ci/actions/
#
name: release

# run only on tags
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # needed to write releases
  id-token: write # needed for keyless signing
  packages: write # needed for ghcr access

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # this is important, otherwise it won't checkout the full tree (i.e. no previous tags)
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: sigstore/cosign-installer@v4             # installs cosign
      - uses: anchore/sbom-action/download-syft@v0.24.2 # installs syft
      - uses: docker/login-action@v4                   # login to ghcr
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7          # run goreleaser
        with:
          # v6 defaults to goreleaser v2, which is what `version: 2` in
          # .goreleaser.yaml requires; `latest` would lock back to v1
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

