version: '3'

vars:
  DEFAULT_GO_BIN: 'go'
  DEFAULT_GO_SOURCES: './...'
  DEFAULT_GO_BUILD_DIR: 'bin'
  DEFAULT_GO_BUILD_TARGET: './cmd/...'
  DEFAULT_GO_TEST_ARGS: '-race'
  DEFAULT_GO_COVERAGE_FILENAME: 'coverage.out'
  DEFAULT_GO_GITHUBACTION_FILENAME: 'go.yml'
  DEFAULT_GO_VERSION: '1.25'

tasks:
  default:
    cmds:
      - task: test
      - task: ci

  pre-commit:
    cmds:
      - task: test

  build:
    desc: Build the go binaries
    summary: |
      Build every main package of the project.

      The following variables are available:

      | VARIABLE    | DESCRIPTION                | DEFAULT |
      |-------------|----------------------------|---------|
      | `GO_BIN`    | go binary                  | `{{ .DEFAULT_GO_BIN }}` |
      | `BUILD_DIR` | where binaries are written | `{{ .DEFAULT_GO_BUILD_DIR }}` |
      | `TARGET`    | packages to build          | `{{ .DEFAULT_GO_BUILD_TARGET }}` |

      Usual environment variables used for building a golang application are obviously available like:
        - `GOOS` for setting the build OS
        - `GOARCH` for setting the build architecture

      Examples:
        - `task {{ .TASK }}` builds every command into `{{ .DEFAULT_GO_BUILD_DIR }}`
        - `TARGET=./cmd/tk task {{ .TASK }}` builds a single command
    vars:
      GO_BIN: '{{ .GO_BIN | default .DEFAULT_GO_BIN }}'
      BUILD_DIR: '{{ .BUILD_DIR | default .DEFAULT_GO_BUILD_DIR }}'
      TARGET: '{{ .TARGET | default .DEFAULT_GO_BUILD_TARGET }}'
    cmds:
      - '{{ .GO_BIN }} build -o {{ .BUILD_DIR }}/ {{ .TARGET }} {{ .CLI_ARGS }}'

  test:
    desc: Run the go tests
    summary: |
      Run the test suite of the project.

      The following variables are available:

      | VARIABLE    | DESCRIPTION               | DEFAULT |
      |-------------|---------------------------|---------|
      | `GO_BIN`    | go binary                 | `{{ .DEFAULT_GO_BIN }}` |
      | `SOURCES`   | go sources of the project | `{{ .DEFAULT_GO_SOURCES }}` |
      | `TEST_ARGS` | go test arguments         | `{{ .DEFAULT_GO_TEST_ARGS }}` |

      Extra arguments can be provided using `--` (non exclusive with `TEST_ARGS`).

      Examples:
        - `task {{ .TASK }}` is similar to `go test -race ./...`
        - `task {{ .TASK }} -- -run TestFoo` runs a single test
        - `SOURCES=./pkg/... task {{ .TASK }}` restricts the test to a package
    vars:
      GO_BIN: '{{ .GO_BIN | default .DEFAULT_GO_BIN }}'
      SOURCES: '{{ .SOURCES | default .DEFAULT_GO_SOURCES }}'
      TEST_ARGS: '{{ .TEST_ARGS | default .DEFAULT_GO_TEST_ARGS }}'
    cmds:
      - '{{ .GO_BIN }} test {{ .TEST_ARGS }} {{ .CLI_ARGS }} {{ .SOURCES }}'

  cover:
    desc: Run the go tests and report the coverage
    summary: |
      Run the test suite with coverage enabled and print the per-function report.

      The following variables are available:

      | VARIABLE            | DESCRIPTION               | DEFAULT |
      |---------------------|---------------------------|---------|
      | `GO_BIN`            | go binary                 | `{{ .DEFAULT_GO_BIN }}` |
      | `SOURCES`           | go sources of the project | `{{ .DEFAULT_GO_SOURCES }}` |
      | `COVERAGE_FILENAME` | coverage profile          | `{{ .DEFAULT_GO_COVERAGE_FILENAME }}` |
    vars:
      GO_BIN: '{{ .GO_BIN | default .DEFAULT_GO_BIN }}'
      SOURCES: '{{ .SOURCES | default .DEFAULT_GO_SOURCES }}'
      COVERAGE_FILENAME: '{{ .COVERAGE_FILENAME | default .DEFAULT_GO_COVERAGE_FILENAME }}'
    cmds:
      - '{{ .GO_BIN }} test -covermode=atomic -coverprofile={{ .COVERAGE_FILENAME }} {{ .SOURCES }}'
      - '{{ .GO_BIN }} tool cover -func={{ .COVERAGE_FILENAME }}'

  tidy:
    desc: Tidy the go module
    vars:
      GO_BIN: '{{ .GO_BIN | default .DEFAULT_GO_BIN }}'
    cmds:
      - '{{ .GO_BIN }} mod tidy'

  ci:
    desc: Generate GitHub Action
    summary: |
      Generate a standardized GitHub Action running the test suite.
      This configuration is auto-generated and should not be manually modified as it can be overwritten.
    vars:
      GITHUBACTION_FILENAME: '{{ .ROOT_DIR }}/.github/workflows/{{ .GITHUBACTION_FILENAME | default .DEFAULT_GO_GITHUBACTION_FILENAME }}'
    cmds:
      - mkdir -p $(dirname "{{ .GITHUBACTION_FILENAME }}")
      - echo "${GITHUBACTION_CONTENT}" > "{{ .GITHUBACTION_FILENAME }}"
    status:
      - test -f '{{ .GITHUBACTION_FILENAME }}'
    env:
      GITHUBACTION_CONTENT: |
        # THIS FILE HAS BEEN GENERATED BY THE COMMAND `{{ .TASK }}`; DO NOT EDIT;
        name: go
        on:
          push:
            branches:
              - develop
              - main
              - master
          pull_request:

        permissions:
          contents: read

        jobs:
          test:
            strategy:
              matrix:
                go: ['{{ .DEFAULT_GO_VERSION }}']
                os: [macos-latest, ubuntu-latest]
            name: test
            runs-on: ${{ "{{ matrix.os }}" }}
            steps:
              - uses: actions/checkout@v4
              - uses: actions/setup-go@v5
                with:
                  go-version: ${{ "{{ matrix.go }}" }}
              - name: build
                run: go build ./...
              - name: test
                run: go test -race ./...
