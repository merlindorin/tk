version: '3'

vars:
  DEFAULT_GO_BIN: 'go'
  DEFAULT_TK_PACKAGE: 'github.com/merlindorin/tk/cmd/tk'
  DEFAULT_TK_BIN_NAME: 'tk'
  DEFAULT_TK_VERSION: 'latest'

tasks:
  default:
    cmds:
      - task: status

  pre-commit:
    cmds:
      - task: status

  install:
    desc: Pin tk as a tool of this module
    summary: |
      Pin tk in the `tool` block of go.mod.

      Pinning it there rather than installing it globally is what lets Dependabot keep tk itself up to date: the
      `gomod` ecosystem covers tool directives, so a new tk release becomes a pull request like any other bump.

      The following variables are available:

      | VARIABLE  | DESCRIPTION       | DEFAULT |
      |-----------|-------------------|---------|
      | `GO_BIN`  | go binary         | `{{ .DEFAULT_GO_BIN }}` |
      | `PACKAGE` | tk package        | `{{ .DEFAULT_TK_PACKAGE }}` |
      | `VERSION` | version to pin    | `{{ .DEFAULT_TK_VERSION }}` |
    vars:
      GO_BIN: '{{ .GO_BIN | default .DEFAULT_GO_BIN }}'
      PACKAGE: '{{ .PACKAGE | default .DEFAULT_TK_PACKAGE }}'
      VERSION: '{{ .VERSION | default .DEFAULT_TK_VERSION }}'
    cmd: '{{ .GO_BIN }} get -tool {{ .PACKAGE }}@{{ .VERSION }}'
    status:
      - go tool | grep {{ .PACKAGE }}

  uninstall:
    vars:
      GO_BIN: '{{ .GO_BIN | default .DEFAULT_GO_BIN }}'
      PACKAGE: '{{ .PACKAGE | default .DEFAULT_TK_PACKAGE }}'
    cmd: '{{ .GO_BIN }} get -tool {{ .PACKAGE }}@none'

  run:
    desc: Run the pinned tk
    summary: |
      Run tk. The purpose is to have a reusable way to run the tk pinned in go.mod.

      The following variables are available:

      | VARIABLE   | DESCRIPTION   | DEFAULT |
      |------------|---------------|---------|
      | `BIN_NAME` | tk bin name   | `{{ .DEFAULT_TK_BIN_NAME }}` |
      | `TK_ARGS`  | tk arguments  | `` |

      Examples:
        - `task {{ .TASK }} -- list` is similar to `tk list`
        - `TK_ARGS="status" task {{ .TASK }}` is similar to `tk status`
    vars:
      BIN_NAME: '{{ .BIN_NAME | default .DEFAULT_TK_BIN_NAME }}'
      GO_BIN: '{{ .GO_BIN | default .DEFAULT_GO_BIN }}'
    cmd: '{{ .GO_BIN }} tool {{ .BIN_NAME }} {{ .TK_ARGS }} {{ .CLI_ARGS }}'

  update:
    desc: Regenerate the powerpacks from the pinned tk
    summary: |
      Regenerate `.tk/`, the tk owned lines of `Taskfile.yaml` and the files the powerpacks own, from the
      powerpacks embedded in the pinned tk. Run it after Dependabot bumps tk in go.mod.
    cmds:
      - task: run
        vars:
          TK_ARGS: 'update'

  status:
    desc: Fail when the powerpacks are out of date
    summary: |
      Report what `update` would change and exit with a non-zero status when the project is out of date. This is
      what the generated GitHub Action runs on pull requests.
    cmds:
      - task: run
        vars:
          TK_ARGS: 'status --check'
